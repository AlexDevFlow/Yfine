<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <script>
    (function(){
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yfine — Login</title>
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico" />
  <link rel="stylesheet" href="/static/vendor/fonts/public-sans.css" />
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <style>
    html { background: #f5f5f9; }
    html[data-bs-theme="dark"] { background: #232333; }
    body {
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bs-body-bg, #f5f5f9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #696cff 0%, #5f5fdb 100%);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      color: #fff;
    }
    .login-body { padding: 2rem; }
    .login-input {
      border-radius: 10px;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      font-size: 0.95rem;
    }
    .login-input:focus {
      border-color: #696cff;
      box-shadow: 0 0 0 0.25rem rgba(105, 108, 255, 0.25);
    }
    .input-icon-wrapper { position: relative; }
    .input-icon-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--bs-secondary-color, #8592a3);
      font-size: 1.1rem;
    }
    .btn-login {
      background: #696cff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      color: #fff;
      transition: all .2s ease;
    }
    .btn-login:hover { background: #5f5fdb; color: #fff; }
    .btn-login:disabled { opacity: .65; }
    .alert-login {
      border-radius: 10px;
      font-size: 0.875rem;
      display: none;
    }
    .alert-login.show { display: block; }
    .dot-wave { --uib-size:32px; --uib-speed:1s; --uib-color:#fff; display:inline-flex; flex-flow:row nowrap; align-items:center; justify-content:space-between; width:var(--uib-size); height:calc(var(--uib-size)*0.17); padding-top:calc(var(--uib-size)*0.34); }
    .dot-wave__dot { flex-shrink:0; width:calc(var(--uib-size)*0.17); height:calc(var(--uib-size)*0.17); border-radius:50%; background-color:var(--uib-color); will-change:transform; }
    .dot-wave__dot:nth-child(1) { animation:dw var(--uib-speed) ease-in-out calc(var(--uib-speed)*-0.45) infinite; }
    .dot-wave__dot:nth-child(2) { animation:dw var(--uib-speed) ease-in-out calc(var(--uib-speed)*-0.3) infinite; }
    .dot-wave__dot:nth-child(3) { animation:dw var(--uib-speed) ease-in-out calc(var(--uib-speed)*-0.15) infinite; }
    .dot-wave__dot:nth-child(4) { animation:dw var(--uib-speed) ease-in-out infinite; }
    @keyframes dw { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-200%)} }
  </style>
</head>
<body>
  <div class="login-card card shadow-lg">
    <div class="login-header">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="rgba(255,255,255,0.2)"/>
        <path d="M8 8L14.5 18V25H17.5V18L24 8H20.5L16 16L11.5 8H8Z" fill="white"/>
      </svg>
      <h4 class="mt-3 mb-1">Yfine</h4>
      <p class="mb-0 opacity-75" style="font-size:.9rem">
        <i class="bi bi-shield-lock me-1"></i>{{ message or _('login_subtitle') }}
      </p>
    </div>
    <div class="login-body">
      <div class="alert alert-danger alert-login" id="login-error"></div>

      <form id="login-form" autocomplete="off">
        <div class="mb-3">
          <div class="input-icon-wrapper">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control login-input" id="password"
                   placeholder="{{ _('password') }}" autofocus required>
          </div>
        </div>
        <button type="submit" class="btn btn-login" id="login-btn">
          <span id="login-text"><i class="bi bi-box-arrow-in-right me-1"></i>{{ _('login_button') }}</span>
          <span id="login-loading" class="d-none">
            <div class="dot-wave"><div class="dot-wave__dot"></div><div class="dot-wave__dot"></div><div class="dot-wave__dot"></div><div class="dot-wave__dot"></div></div>
          </span>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('login-btn');
      var errEl = document.getElementById('login-error');
      var pw = document.getElementById('password').value;

      btn.disabled = true;
      document.getElementById('login-text').classList.add('d-none');
      document.getElementById('login-loading').classList.remove('d-none');
      errEl.classList.remove('show');

      try {
        var resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });

        if (resp.ok) {
          window.location.href = '/';
        } else {
          var data = await resp.json().catch(function() { return {}; });
          errEl.textContent = data.detail || '{{ _("login_error") }}';
          errEl.classList.add('show');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        errEl.textContent = '{{ _("login_error") }}';
        errEl.classList.add('show');
      }

      btn.disabled = false;
      document.getElementById('login-text').classList.remove('d-none');
      document.getElementById('login-loading').classList.add('d-none');
    });
  </script>
</body>
</html>
